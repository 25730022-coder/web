[data-theme=dark]{--bg:#2b2d33;--pn:#3a3b42;--bar:#000;--barfg:#eef0f4;--bs:#b9bdc9;--ink:#eef0f4;--sub:#b9bdc9;--ac:#27e1e8;--on:#001;--cd:#33343b;--bot:#c9ccd6;--me:#f3f4f7;--ln:#27e1e833;--ok:#4fe3a8;--wn:#ffc54d;--dg:#ff7a86;--tk:#fff3;--sh:0 1px 2px #0006}
*{box-sizing:border-box}html{font-size:var(--fs);height:100%}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 1rem/1.6 'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[data-theme=dark] :focus-visible{outline-color:#27e1e8}
header{display:flex;align-items:center;gap:.8rem;padding:.45rem 1.2rem;background:var(--bar);color:var(--barfg);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;flex:none}
.pill{border:1px solid currentColor;background:transparent;border-radius:50%;width:2rem;height:2rem;padding:0;display:grid;place-items:center;transition:background-color .15s}.pill svg{width:1.1rem;height:1.1rem}
.pill:hover{background:#ffffff1f}
[data-theme=dark] .pill{border-color:var(--ac);color:var(--ac)}
.brand{font-weight:700;font-size:.95rem;letter-spacing:.1em;text-decoration:none;color:inherit}
footer{padding:.45rem 1rem;text-align:center;font-size:.75rem;background:var(--bar);color:var(--bs);border-top:1px solid #ffffff1a;flex:none}
#app{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
body[data-view=chat] #app,body[data-view=my] #app{overflow:hidden}   /* 마이페이지도 스크롤바 없음: 화면이 작으면 myFit 이 통째로 줄임 */
.btn{border:0;border-radius:var(--r);padding:.42rem .85rem;font-size:.875rem;font-weight:500;background:var(--ac);color:var(--on);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:filter .15s,background-color .15s}
.btn:hover{filter:brightness(1.07)}.btn svg{width:1.1em;height:1.1em}
.btn.dk{background:#1f2a4d;color:#fff}[data-theme=dark] #side .btn.dk{background:#1b1d22;border:1px solid var(--ln)}
.btn.yl{background:transparent;color:inherit;font-weight:400;text-decoration:underline;text-underline-offset:3px;opacity:.8}.btn.yl:hover{opacity:1;filter:none}
.btn.gh{background:transparent;border:1px solid currentColor}
.btn.dg{background:#c22a3b;color:#fff}.btn:disabled{opacity:.6;cursor:default;filter:none}#menu button.dng{color:var(--dg)}#menu button[data-a=out],#menu button[data-a=wd]{text-align:center}#menu button[data-a=out]{margin-top:.2rem}dialog .wdp{margin:0;text-align:center;font-size:.9rem;color:#4a557c}
.wrap{padding:1rem max(1rem,5vw);display:grid;grid-template-columns:260px 1fr;gap:.8rem;align-items:start}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r2);padding:1.1rem;box-shadow:var(--sh)}
.card h3{margin:0 0 .7rem;font-size:.95rem;font-weight:700}.av{width:56px;height:56px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-size:1.5rem;font-weight:700}
.bar1{height:.5rem;border-radius:9px;background:var(--tk);overflow:hidden}.bar1 i{display:block;height:100%;background:var(--ac)}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}.lst button{width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:.5rem .75rem;transition:border-color .15s}.lst button:hover{border-color:var(--ink)}
#chat{flex:1;display:flex;min-height:0;overflow:hidden}
#side{width:250px;flex:none;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-top{display:flex;align-items:center;gap:.35rem;padding:.8rem .6rem 0}
.side-top #nw{flex:1}
.side-tab{flex:none;width:1.6rem;height:1.6rem;border:0;border-radius:8px;background:transparent;color:var(--ink);display:grid;place-items:center;padding:0}
.side-tab svg{width:1rem;height:1rem;display:block}
.side-tab:hover{background:var(--tk)}
.side-body{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.5rem;padding:.8rem;overflow:auto;scrollbar-width:none}
.side-body::-webkit-scrollbar{display:none;width:0;height:0}
#chat:not(.side-on) #side{width:auto;background:transparent;border-right:0}
#chat:not(.side-on) .side-body,#chat:not(.side-on) #nw{display:none}
#chat:not(.side-on) .side-top{padding:.7rem .35rem}
#side .it{display:flex;align-items:center;gap:.2rem}#side .it button:first-child{flex:1;text-align:left;background:none;border:0;padding:.45rem .6rem;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem;line-height:1.4}
#side .it button:first-child small{opacity:.65;font-size:.75rem}
#side .it:hover button:first-child{background:var(--tk)}#side .it.on button:first-child{background:var(--cd)}
.x{background:none;border:0;opacity:.55;display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:6px;padding:0;flex:none}.x:hover{opacity:1;background:var(--tk)}.x svg{width:.9rem;height:.9rem}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#log{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:1.25rem max(1rem,6%);display:flex;flex-direction:column;gap:.75rem}
#log::-webkit-scrollbar{display:none;width:0;height:0}
.m{max-width:min(44rem,92%);padding:.7rem 1rem;border-radius:var(--r2);color:#1b2140;font-size:.95rem;line-height:1.65;box-shadow:var(--sh);overflow-wrap:anywhere;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}.m.b{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px;white-space:normal}
.m.e{background:#fdf3f4;border:1px solid #ecc3c8}.eh{display:inline-flex;align-items:center;gap:.35rem;color:#c22a3b;font-weight:700}.eh svg{width:1.05em;height:1.05em}

<script>
/* ============ 설정: 여기만 바꾸면 API 연결 완료 ============
 * app.py 가 이 화면과 API 를 같은 주소에서 제공하므로 BASE 는 '' 그대로 두면 됩니다.
 * POST {BASE}/api/analyze  요청: {type:'auto|smishing|deepfake|fakenews', text, image:{mime,data(base64)}|null}
 *   응답: {type, title, verdict:'danger|check|safe', risk:0~100, summary, reasons:[], cautions:[]}
 * POST {BASE}/api/chat     요청: {message, mode:'normal|easy|short', context:<analyze 응답>, history:[{role:'user|model',text}]}
 *   응답: {reply}
 * GET  {BASE}/api/threat-universe  응답: {reference_year,updated_at,period:'annual',categories:[{type,statistics,reference_statistics}],sources}
 *   (이 화면에서는 호출하지 않음. 마이페이지 '탐정의 사건 수첩'은 그 계정의 이용 기록(카테고리별 이용 건수)으로 그립니다)
 * Gemini API 키는 서버(환경변수)에만 두세요. 프론트에 넣지 않습니다. */
const CFG={MOCK:location.protocol==='file:',BASE:''}; // 파일로 직접 열면 데모(MOCK), 서버(Cloud Run)에서 열면 실제 API 사용

const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TN={auto:'자동',smishing:'스미싱',deepfake:'딥페이크',fakenews:'가짜뉴스'};
const I=d=>`<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={warn:I('<path d="M12 3.6 2.9 19.4h18.2L12 3.6Z"/><path d="M12 10v4.4M12 17.2v.1"/>'),q:I('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7M12 17v.1"/>'),ok:I('<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.8 5.4-5.5"/>'),x:I('<path d="M6 6l12 12M18 6 6 18"/>'),trash:I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5h10L18 7M9 7V4.5h6V7"/>'),plus:I('<path d="M12 5v14M5 12h14"/>'),up:I('<path d="M12 19V5M6 11l6-6 6 6"/>'),user:I('<circle cx="12" cy="8.2" r="3.7"/><path d="M4.8 20c.6-3.8 3.5-6 7.2-6s6.6 2.2 7.2 6"/>')};
const VD={danger:[IC.warn,'위험 의심'],check:[IC.q,'추가 확인 필요'],safe:[IC.ok,'위험 징후 미확인']};
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S={booted:false,guest:false,user:ls.get('dt_session',null),chats:[],cur:null,type:'auto',file:null,busy:false,sideOn:matchMedia('(min-width:821px)').matches};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const say=t=>{$('#live').textContent=t};

/* ---------- API 어댑터 ---------- */
async function api(path,body){
  if(CFG.MOCK)return mock(path,body);
  let r;
  try{r=await fetch(CFG.BASE+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
  catch{throw new Error('서버에 연결하지 못했어요')}
  if(!r.ok){let m='서버 응답 오류 ('+r.status+')';try{m=(await r.json()).error||m}catch{}throw new Error(m)}
  return r.json();
}
async function mock(path,b){
  if(path==='/api/threat-universe')throw new Error('데모 모드: 서버에 연결되지 않아 공식 통계를 불러올 수 없어요');   // 테스트용 가짜 숫자를 만들지 않음

  if(path==='/api/chat'){const m={easy:'쉽게 말해, 보낸 사람이 급하게 누르게 만들려는 말투와 이상한 주소가 닮아서 조심하라는 뜻이에요. 링크는 누르지 말고 공식 앱에서 직접 확인하세요.',short:'핵심: 급한 말투 + 낯선 링크 = 위험 신호. 누르지 말고 공식 경로로 확인하세요.',normal:'링크 주소가 공식 도메인과 다르고, “즉시”, “정지” 같은 압박 표현이 있어 위험하다고 봤어요. (데모 응답입니다)'};return{reply:m[b.mode]||m.normal}}

function myFit(){                                         // 마이페이지는 스크롤 대신, 화면 크기에 맞춰 통째로 줄여서 한 화면에 보여 줌

  const vw=a.clientWidth,vh=a.clientHeight;if(!vw||!vh)return;

    return w.offsetHeight};

function msgHTML(m,last){
  if(m.r==='u')return`<div class="m u">${m.img?`<img src="${m.img}" alt="첨부 이미지" style="max-width:220px;border-radius:.5rem;display:block;margin-bottom:.4rem">`:m.hadImg?'<em>[이미지 첨부]</em>\n':''}${esc(m.text)}</div>`;
  if(m.err)return`<div class="m b e" role="alert"><b class="eh">${IC.warn} 분석하지 못했어요</b><br>${esc(m.text)}<div class="chips"><button class="chip" data-retry>다시 시도</button></div></div>`;
  return`<div class="m b">${m.res?resHTML(m.res):esc(m.text)}${last?`<div class="chips"><button class="chip" data-q="왜 이렇게 판단했나요?" data-m="normal">왜 이렇게 판단했나요?</button><button class="chip" data-q="쉽게 설명해 주세요" data-m="easy">쉽게 설명</button><button class="chip" data-q="핵심만 요약해 주세요" data-m="short">핵심만 요약</button></div>`:''}</div>`}
function renderLog(){const c=cur(),l=$('#log');if(!l)return;
  l.innerHTML=c.msgs.length?c.msgs.map((m,i)=>msgHTML(m,i===c.msgs.length-1&&m.r==='b'&&!m.err)).join(''):'<div class="m b">안녕하세요, AI 탐정입니다. 의심되는 문자·이미지·뉴스를 보내 주세요.<br><small>유형을 고르지 않으면 자동으로 판단해요.</small></div>';
  l.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>follow(b.dataset.q,b.dataset.m));
  const rt=l.querySelector('[data-retry]');if(rt)rt.onclick=()=>{c.msgs.pop();const u=c.msgs.pop();save();if(u){$('#tx').value=u.text;S.file=null}renderLog();send()};
  l.scrollTop=l.scrollHeight}
function wait(){const e=document.createElement('div');e.className='m b';e.innerHTML='<span class="dots" aria-hidden="true"><span>●</span><span>●</span><span>●</span></span> 분석 중...';$('#log').append(e);e.scrollIntoView({block:'end'});say('분석 중입니다');return e}
async function send(){
  if(S.busy)return;  const tx=$('#tx'),text=tx.value.trim(),c=cur();
  if(!text&&!S.file)return toast('분석할 내용을 입력하거나 이미지를 첨부해 주세요.');
  if(followMode()&&!S.file&&!looksLikeNewContent(text)){tx.value='';tx.style.height='auto';return follow(text,'normal')}
  if(S.type==='deepfake'&&!S.file)return toast('딥페이크 분석은 이미지 첨부가 필요해요. 왼쪽 + 버튼으로 이미지를 올려 주세요.');
  const f=S.file;c.msgs.push({r:'u',text,img:f?.url,hadImg:!!f});if(c.msgs.length===1){c.title=text.slice(0,20)||'이미지 분석';c.type=S.type}
  tx.value='';tx.style.height='auto';S.file=null;att();renderLog();S.busy=true;const w=wait();
  try{const res=await api('/api/analyze',{type:S.type,text,image:f?{mime:f.mime,data:f.data}:null});
    if(c.type==='auto')c.type=res.type||'auto';c.msgs.push({r:'b',res,text:res.summary});c.fresh=false;say('분석이 완료되었습니다. 결과: '+(VD[res.verdict]||VD.check)[1])}
  catch(e){c.msgs.push({r:'b',err:1,text:(e.message||'알 수 없는 오류')+' — 입력하신 내용은 유지되어 있어요. 네트워크를 확인하고 다시 시도해 주세요.'});say('분석에 실패했습니다')}
  S.busy=false;c.ts=Date.now();save();w.remove();renderLog();renderHist();syncInput()}
async function follow(q,mode){
  if(S.busy)return;const c=cur();c.msgs.push({r:'u',text:q});renderLog();S.busy=true;const w=wait();
  const ctx=[...c.msgs].reverse().find(m=>m.res)?.res,hist=c.msgs.slice(-9,-1).map(m=>({role:m.r==='u'?'user':'model',text:m.text}));
  try{const r=await api('/api/chat',{message:q,mode,context:ctx,history:hist});c.msgs.push({r:'b',text:r.reply});say('답변이 도착했습니다')}
  catch(e){c.msgs.push({r:'b',err:1,text:(e.message||'알 수 없는 오류')+' — 다시 시도해 주세요.'})}
  S.busy=false;save();w.remove();renderLog();syncInput()}

/* ---------- 라우터 ---------- */
let vt=null,vtV=null;                                   // 화면 전환(fade) 대기 중인 타이머와 목표 화면
function route(){
  if(!S.booted)return;
  welcome(!S.user&&!S.guest);                                                    // 비로그인·비게스트이면 시작 화면, 로그인하거나 게스트를 고르면 fade out
  const app=$('#app'),[,p,a]=(location.hash||'#/').split('/');
  const v=p==='my'?'my':'chat';                                                  // 홈('#/')은 채팅 화면. 마이페이지만 따로 있음
  if(vt&&vtV===v)return;                                                         // 같은 화면으로 가는 전환이 이미 진행 중
  clearTimeout(vt);vt=vtV=null;
  const prev=document.body.dataset.view,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const fade=!!prev&&prev!=='boot'&&prev!==v&&!calm;                             // 화면(메인/채팅/마이페이지)이 바뀔 때만 fade
  const render=()=>{
    vt=vtV=null;
    if(v!=='my')stopUniverse();
    document.body.dataset.view=v;
    app.classList.remove('vout');
    if(v==='my')mypage();
    else chatView(a);
    app.scrollTop=0;
    if(fade){app.classList.remove('vin');void app.offsetWidth;app.classList.add('vin')}
  };
  if(fade&&!app.classList.contains('vout')&&!app.classList.contains('leave')){app.classList.remove('vin');app.classList.add('vout');vtV=v;vt=setTimeout(render,220)}
  else render();
}
function endSplash(){
  if(S.booted)return;S.booted=true;const sp=$('#splash');sp.classList.add('out');setTimeout(()=>sp.remove(),700);
  wlFirst=!S.user;                                                                // 비로그인이면 시작 화면이 로고 화면 아래에서 바로 드러남
  if(location.hash==='#/')route();else location.hash='#/'}
$('#splash').onclick=endSplash;addEventListener('keydown',endSplash,{once:true});setTimeout(endSplash,3300);
addEventListener('hashchange',route);
$('.brand').onclick=e=>{e.preventDefault();goHome()};   // 로고 클릭 → 메인 화면
setTheme(ls.get('dt_theme','light'));setBig(ls.get('dt_big',false));
if(S.user)S.chats=ls.get(hkey(),[]);
paint();document.body.dataset.view='boot';
</script>
